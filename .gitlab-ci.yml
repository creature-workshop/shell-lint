# shell-lint CI via the creatures catalog.
#
# The repository holds the lint engine as a shellops consumer and carries no
# version yet, so it takes the governance members of `forge` and not its
# release members: code-review hygiene on a merge request, and the label sync
# so the forge's labels track the manifest. The label sync self-gates to
# release tags in the catalog; here it runs on the default branch, since no
# tag is cut yet. `linear` keeps the merge request and the Linear issues it
# names in step; `agents` puts the owning hat's label on the merge request
# from those issues, which hygiene requires.
# `shell--ops-lint`, `shell--lint` and `shell--test` check the engine under
# `shell/lint` and `cli/` and run its suites, with the vendored shellops. The
# suites read the scanner from `shell/.scan`, so the test job fetches that
# submodule beside `shell/.ops`.

include:
  - component: $CI_SERVER_FQDN/ksoft/creatures/forge--code-review-hygiene@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/forge--update-labels@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/linear@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/agents@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--ops-lint@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--lint@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--test@0.20.0-dev.10
    inputs:
      tests: test/*.bats

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - governance
  - linting
  - validation
  - cleanup

ksoft/govern/update-labels:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

ksoft/shell/test:
  variables:
    GIT_SUBMODULE_PATHS: shell/.ops shell/.scan
