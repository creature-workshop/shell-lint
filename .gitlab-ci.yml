# shell-lint CI via the creatures catalog.

include:
  - component: $CI_SERVER_FQDN/ksoft/creatures/forge@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/linear@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/agents@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--ops-lint@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--lint@0.20.0-dev.10
  - component: $CI_SERVER_FQDN/ksoft/creatures/shell--test@0.20.0-dev.10
    inputs:
      tests: test/*.bats

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The suites read the scanner from shell/.scan, so the test job fetches it beside
# shell/.ops. The runner does not recurse into them: the pinned shell-scan names
# its own shellops by a relative URL, which does not resolve from this
# namespace. The base job's before_script fetches bats-core under shell/.ops.
ksoft/shell/test:
  variables:
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: shell/.ops shell/.scan
